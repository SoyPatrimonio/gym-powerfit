<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagos - PowerFit Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-dumbbell"></i><span>Power<strong>Fit</strong></span>
            </a>
            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
                <a href="personal.html"><i class="fa-solid fa-user-tie"></i> Personal</a>
                <a href="membresias.html"><i class="fa-solid fa-id-card"></i> Membresías</a>
                <a href="pagos.html" class="activo"><i class="fa-solid fa-credit-card"></i> Pagos</a>
                <a href="productos.html"><i class="fa-solid fa-bottle-water"></i> Productos</a>
                <a href="reservas.html"><i class="fa-solid fa-calendar-check"></i> Reservas</a>
                <a href="rutinas.html"><i class="fa-solid fa-clipboard-list"></i> Rutinas</a>
                <a href="planes-nutricionales.html"><i class="fa-solid fa-apple-whole"></i> Nutrición</a>
                <a href="asignaciones.html"><i class="fa-solid fa-link"></i> Asignaciones</a>
                <a href="mediciones.html"><i class="fa-solid fa-weight-scale"></i> Mediciones</a>
                <a href="asistencias.html"><i class="fa-solid fa-door-open"></i> Asistencias</a>
                <a href="reportes.html"><i class="fa-solid fa-chart-line"></i> Reportes</a>
                <a href="#" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Gestión de Pagos</h1>
                <div style="display:flex;gap:0.6rem">
                    <button class="theme-toggle" title="Cambiar tema"><i class="fa-solid fa-sun"></i></button>
                    <button class="btn btn-ghost" onclick="exportarCSV('tablaPagos','pagos.csv')">
                        <i class="fa-solid fa-file-csv"></i> Exportar CSV
                    </button>
                    <button class="btn btn-primary" onclick="abrirNuevo()">
                        <i class="fa-solid fa-plus"></i> Registrar pago
                    </button>
                </div>
            </div>

            <!-- KPI -->
            <div class="kpi-grid">
                <div class="kpi success">
                    <h4>Ingresos del mes</h4>
                    <div class="valor" id="kpiTotal">--</div>
                </div>
                <div class="kpi info">
                    <h4>Transacciones del mes</h4>
                    <div class="valor" id="kpiTx">--</div>
                </div>
            </div>

            <div class="tabla-wrap">
                <div class="tabla-tools">
                    <input type="text" id="buscar" placeholder="Buscar por cliente, método, referencia...">
                </div>
                <table class="data" id="tablaPagos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Membresía</th>
                            <th>Monto</th>
                            <th>Método</th>
                            <th>Fecha</th>
                            <th>Referencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-bg" id="modalPago">
        <div class="modal">
            <button class="modal-close" onclick="cerrarModal('modalPago')"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalTitulo">Registrar pago</h3>
            <form class="form" id="formPago">
                <input type="hidden" name="id_pago" />
                <label>Cliente
                    <select name="id_cliente" id="selCliente" required></select>
                </label>
                <label>Membresía
                    <select name="id_membresia" id="selMem" required></select>
                </label>
                <div class="grid grid-2" style="gap:1rem">
                    <label>Monto (COP) <input type="number" name="monto" step="1000" min="0" required placeholder="80000"></label>
                    <label>Método de pago
                        <select name="metodo_pago">
                            <option>Efectivo</option>
                            <option>Tarjeta</option>
                            <option>Transferencia</option>
                            <option>Nequi</option>
                            <option>Daviplata</option>
                            <option>PSE</option>
                            <option>Otro</option>
                        </select>
                    </label>
                </div>
                <label>Fecha de pago <input type="date" name="fecha_pago"></label>
                <label>Referencia <input type="text" name="referencia" placeholder="Nº de comprobante / referencia"></label>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <small class="msg" id="msgPago"></small>
            </form>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script>
        const tbody = document.querySelector('#tablaPagos tbody');
        const formPago = document.getElementById('formPago');

        const DEMO_PAGOS = [
            { id_pago:1, id_cliente:1, cliente:'Juan Carlos Pérez',  id_membresia:2, membresia:'Plan Mensual',    monto:80000,  metodo_pago:'Efectivo',      fecha_pago:'2026-05-01', referencia:'COMP-001' },
            { id_pago:2, id_cliente:2, cliente:'María José López',   id_membresia:3, membresia:'Plan Trimestral', monto:210000, metodo_pago:'Transferencia', fecha_pago:'2026-04-15', referencia:'COMP-002' },
            { id_pago:3, id_cliente:3, cliente:'Luis Andrés Castro', id_membresia:2, membresia:'Plan Mensual',    monto:80000,  metodo_pago:'Tarjeta',       fecha_pago:'2026-05-10', referencia:'COMP-003' },
            { id_pago:4, id_cliente:4, cliente:'Ana Lucía Vargas',   id_membresia:5, membresia:'Plan Anual',      monto:720000, metodo_pago:'Transferencia', fecha_pago:'2026-01-01', referencia:'COMP-004' },
            { id_pago:5, id_cliente:5, cliente:'Pedro Salazar',      id_membresia:1, membresia:'Plan Diario',     monto:15000,  metodo_pago:'Efectivo',      fecha_pago:'2026-03-15', referencia:'COMP-005' },
            { id_pago:6, id_cliente:2, cliente:'María José López',   id_membresia:2, membresia:'Plan Mensual',    monto:80000,  metodo_pago:'Nequi',         fecha_pago:'2026-05-15', referencia:'COMP-006' },
            { id_pago:7, id_cliente:1, cliente:'Juan Carlos Pérez',  id_membresia:2, membresia:'Plan Mensual',    monto:80000,  metodo_pago:'Daviplata',     fecha_pago:'2026-04-01', referencia:'COMP-007' }
        ];
        const store = demoStore('powerfit_pagos', DEMO_PAGOS);
        let MODO_DEMO = false;

        function actualizarKPIs(lista) {
            const ahora = new Date();
            const mesActual = lista.filter(p => {
                const d = new Date(p.fecha_pago);
                return d.getMonth() === ahora.getMonth() && d.getFullYear() === ahora.getFullYear();
            });
            const total = mesActual.reduce((s, p) => s + Number(p.monto), 0);
            document.getElementById('kpiTotal').textContent = formatoMoneda(total || lista.reduce((s,p)=>s+Number(p.monto),0));
            document.getElementById('kpiTx').textContent    = mesActual.length || lista.length;
        }

        function render(lista) {
            tbody.innerHTML = lista.map(p => `
                <tr>
                    <td>${p.id_pago}</td>
                    <td>${p.cliente}</td>
                    <td>${p.membresia}</td>
                    <td>${formatoMoneda(p.monto)}</td>
                    <td>${p.metodo_pago}</td>
                    <td>${formatoFecha(p.fecha_pago)}</td>
                    <td>${p.referencia || '-'}</td>
                    <td class="acciones">
                        <button onclick='imprimirRecibo(${JSON.stringify(p).replace(/"/g, "&quot;")})' title="Imprimir recibo"><i class="fa-solid fa-print"></i></button>
                        <button onclick="editar(${p.id_pago})" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-del" onclick="eliminar(${p.id_pago})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="8" style="text-align:center;color:#888">Sin registros</td></tr>';
            actualizarKPIs(lista);
        }

        async function cargar() {
            const rep = await api('../php/pagos.php?accion=reporte_mes');
            const r = await api('../php/pagos.php?accion=listar');
            if (r.ok && Array.isArray(r.datos)) {
                MODO_DEMO = false;
                if (rep.ok) {
                    document.getElementById('kpiTotal').textContent = formatoMoneda(rep.datos.total);
                    document.getElementById('kpiTx').textContent    = rep.datos.transacciones ?? 0;
                }
                render(r.datos);
                return;
            }
            MODO_DEMO = true;
            render(store.all());
        }

        // ===== Imprimir recibo =====
        function imprimirRecibo(p) {
            const w = window.open('', '_blank', 'width=600,height=700');
            const html = `
            <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Recibo #${p.id_pago}</title>
            <style>
                body { font-family: 'Courier New', monospace; padding: 30px; color: #222; }
                .recibo { max-width: 380px; margin: 0 auto; border: 2px dashed #333; padding: 24px; }
                h1 { text-align: center; color: #ff3d2e; margin-bottom: 4px; font-size: 22px; }
                .sub { text-align: center; font-size: 12px; margin-bottom: 18px; color: #555; }
                .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #ccc; font-size: 13px; }
                .total { font-size: 20px; font-weight: bold; margin-top: 16px; text-align: right; color: #ff3d2e; }
                .footer { text-align: center; font-size: 11px; margin-top: 20px; color: #666; }
                @media print { body { padding: 0; } .no-print { display: none; } }
            </style></head><body>
            <div class="recibo">
                <h1>PowerFit Gym</h1>
                <div class="sub">Carrera 13 # 85-32, Bogotá<br>NIT 900.123.456-7 · Tel +57 320 123 4567</div>
                <div class="row"><span>Recibo Nº:</span><strong>${String(p.id_pago).padStart(6,'0')}</strong></div>
                <div class="row"><span>Cliente:</span><strong>${p.cliente}</strong></div>
                <div class="row"><span>Membresía:</span><strong>${p.membresia}</strong></div>
                <div class="row"><span>Método:</span><strong>${p.metodo_pago}</strong></div>
                <div class="row"><span>Fecha:</span><strong>${formatoFecha(p.fecha_pago)}</strong></div>
                <div class="row"><span>Referencia:</span><strong>${p.referencia || '-'}</strong></div>
                <div class="total">TOTAL: ${formatoMoneda(p.monto)}</div>
                <div class="footer">¡Gracias por entrenar con nosotros!<br>www.powerfit.com.co</div>
            </div>
            <div style="text-align:center;margin-top:20px" class="no-print">
                <button onclick="window.print()" style="padding:10px 20px;background:#ff3d2e;color:#fff;border:none;border-radius:6px;cursor:pointer">Imprimir</button>
            </div>
            <script>setTimeout(()=>window.print(),300);<\/script>
            </body></html>`;
            w.document.write(html);
            w.document.close();
        }

        async function cargarSelects() {
            const [cs, ms] = await Promise.all([
                api('../php/clientes.php?accion=listar'),
                api('../php/membresias.php?accion=listar')
            ]);
            // Clientes: usar BD si disponible, sino localStorage demo
            const clientes = (cs.ok && Array.isArray(cs.datos))
                ? cs.datos
                : (JSON.parse(localStorage.getItem('powerfit_clientes') || 'null') || [
                    { id_cliente:1, nombre:'Juan Carlos', apellido:'Pérez Gómez',   documento:'1020304050' },
                    { id_cliente:2, nombre:'María José',  apellido:'López Mendoza', documento:'1030405060' },
                    { id_cliente:3, nombre:'Luis Andrés', apellido:'Castro Silva',  documento:'1040506070' },
                    { id_cliente:4, nombre:'Ana Lucía',   apellido:'Vargas Ríos',   documento:'1050607080' },
                    { id_cliente:5, nombre:'Pedro',       apellido:'Salazar Mora',  documento:'1060708090' }
                ]);
            const memb = (ms.ok && Array.isArray(ms.datos))
                ? ms.datos
                : (JSON.parse(localStorage.getItem('powerfit_membresias') || 'null') || [
                    { id_membresia:1, nombre:'Plan Diario',     precio:15000 },
                    { id_membresia:2, nombre:'Plan Mensual',    precio:80000 },
                    { id_membresia:3, nombre:'Plan Trimestral', precio:210000 },
                    { id_membresia:4, nombre:'Plan Semestral',  precio:390000 },
                    { id_membresia:5, nombre:'Plan Anual',      precio:720000 }
                ]);
            document.getElementById('selCliente').innerHTML =
                '<option value="">-- Selecciona --</option>' +
                clientes.map(c => `<option value="${c.id_cliente}" data-nombre="${c.nombre} ${c.apellido}">${c.nombre} ${c.apellido} (${c.documento})</option>`).join('');
            document.getElementById('selMem').innerHTML =
                '<option value="">-- Selecciona --</option>' +
                memb.map(m => `<option value="${m.id_membresia}" data-precio="${m.precio}" data-nombre="${m.nombre}">${m.nombre} (${formatoMoneda(m.precio)})</option>`).join('');
        }

        // Autollenar monto al elegir membresía
        document.getElementById('selMem').addEventListener('change', e => {
            const opt = e.target.selectedOptions[0];
            if (opt && opt.dataset.precio) formPago.monto.value = opt.dataset.precio;
        });

        function abrirNuevo() {
            formPago.reset();
            formPago.id_pago.value = '';
            document.getElementById('modalTitulo').textContent = 'Registrar pago';
            abrirModal('modalPago');
        }

        async function editar(id) {
            if (MODO_DEMO) {
                const p = store.all().find(x => x.id_pago === id);
                if (!p) return;
                formPago.id_pago.value       = p.id_pago;
                formPago.id_cliente.value    = p.id_cliente;
                formPago.id_membresia.value  = p.id_membresia;
                formPago.monto.value         = p.monto;
                formPago.metodo_pago.value   = p.metodo_pago;
                formPago.fecha_pago.value    = String(p.fecha_pago).substring(0, 10);
                formPago.referencia.value    = p.referencia || '';
                document.getElementById('modalTitulo').textContent = 'Editar pago';
                abrirModal('modalPago');
                return;
            }
            const r = await api('../php/pagos.php?accion=obtener&id=' + id);
            if (!r.ok) return toast(r.mensaje, 'error');
            const p = r.datos;
            formPago.id_pago.value       = p.id_pago;
            formPago.id_cliente.value    = p.id_cliente;
            formPago.id_membresia.value  = p.id_membresia;
            formPago.monto.value         = p.monto;
            formPago.metodo_pago.value   = p.metodo_pago;
            formPago.fecha_pago.value    = String(p.fecha_pago).substring(0, 10);
            formPago.referencia.value    = p.referencia || '';
            document.getElementById('modalTitulo').textContent = 'Editar pago';
            abrirModal('modalPago');
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este pago?')) return;
            if (MODO_DEMO) {
                const lista = store.all().filter(p => p.id_pago !== id);
                store.save(lista);
                toast('Pago eliminado', 'ok');
                render(lista);
                return;
            }
            const r = await api('../php/pagos.php?accion=eliminar', { id_pago: id });
            toast(r.mensaje, r.ok ? 'ok' : 'error');
            if (r.ok) cargar();
        }

        formPago.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msgPago');
            const datos = Object.fromEntries(new FormData(formPago));
            if (!datos.id_cliente)   { msg.textContent='Selecciona un cliente';   msg.className='msg error'; return; }
            if (!datos.id_membresia) { msg.textContent='Selecciona una membresía';msg.className='msg error'; return; }
            if (!datos.monto || Number(datos.monto) <= 0) { msg.textContent='Monto inválido'; msg.className='msg error'; return; }

            if (MODO_DEMO) {
                const selCli = document.getElementById('selCliente').selectedOptions[0];
                const selMem = document.getElementById('selMem').selectedOptions[0];
                datos.cliente   = selCli?.dataset.nombre || 'Cliente';
                datos.membresia = selMem?.dataset.nombre || 'Membresía';
                datos.monto = Number(datos.monto);
                datos.id_cliente = Number(datos.id_cliente);
                datos.id_membresia = Number(datos.id_membresia);
                if (!datos.fecha_pago) datos.fecha_pago = new Date().toISOString().substring(0,10);

                const lista = store.all();
                if (datos.id_pago) {
                    const i = lista.findIndex(p => p.id_pago === Number(datos.id_pago));
                    if (i >= 0) lista[i] = { ...lista[i], ...datos, id_pago: lista[i].id_pago };
                } else {
                    datos.id_pago = store.nextId('id_pago');
                    if (!datos.referencia) datos.referencia = 'COMP-' + String(datos.id_pago).padStart(3,'0');
                    lista.push(datos);
                }
                store.save(lista);
                msg.textContent = 'Pago guardado';
                msg.className = 'msg ok';
                setTimeout(() => { cerrarModal('modalPago'); render(store.all()); }, 500);
                return;
            }

            const accion = datos.id_pago ? 'actualizar' : 'crear';
            const r = await api('../php/pagos.php?accion=' + accion, datos);
            msg.textContent = r.mensaje;
            msg.className = 'msg ' + (r.ok ? 'ok' : 'error');
            if (r.ok) setTimeout(() => { cerrarModal('modalPago'); cargar(); }, 600);
        });

        filtrarTabla('buscar', 'tablaPagos');
        cargarSelects();
        cargar();
    </script>
</body>
</html>
